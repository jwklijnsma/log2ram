name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: shellcheck -S warning log2ram-guard.sh build-deb.sh debian/postinst debian/prerm debian/postrm

      - name: Determine version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # release when a v* tag is pushed, or when main has a VERSION without a release yet
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release=true
          elif [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main ]] \
               && ! gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version $v, release: $release"

      - name: Build package
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          deb="$(./build-deb.sh)"
          test -f "$deb"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"

      - name: Inspect package
        run: |
          dpkg-deb --info "${{ steps.build.outputs.deb }}"
          dpkg-deb --contents "${{ steps.build.outputs.deb }}"

      - name: Test install
        run: |
          sudo apt-get install -y "./${{ steps.build.outputs.deb }}"
          /usr/sbin/log2ram-guard --help
          sudo apt-get purge -y log2ram-guard

      - uses: actions/upload-artifact@v7
        with:
          name: log2ram-guard-deb
          path: dist/*.deb

      - name: Release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: log2ram-guard ${{ steps.ver.outputs.version }}
          files: dist/*.deb
          generate_release_notes: true
