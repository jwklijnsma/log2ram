name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ShellCheck
        run: shellcheck -S warning log2ram-guard.sh build-deb.sh debian/postinst debian/prerm debian/postrm

      - name: Build package
        id: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "deb=$(./build-deb.sh)" >> "$GITHUB_OUTPUT"

      - name: Inspect package
        run: |
          dpkg-deb --info "${{ steps.build.outputs.deb }}"
          dpkg-deb --contents "${{ steps.build.outputs.deb }}"

      - name: Test install
        run: |
          sudo apt-get install -y "./${{ steps.build.outputs.deb }}"
          /usr/sbin/log2ram-guard --help
          sudo apt-get purge -y log2ram-guard

      - uses: actions/upload-artifact@v7
        with:
          name: log2ram-guard-deb
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
